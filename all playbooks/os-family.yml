---
- name: identify os family
  hosts: all
  become: true
  tasks:
    - name: check os family
      debug:
        msg: "this machine os family is {{ ansible_os_family }}"



It's an Ansible Magic Variable (Fact)
ansible_os_family is a built-in fact that Ansible automatically collects for you. Here's what happens behind the scenes:

Before Your Tasks Run
TASK [Gathering Facts] ************************************
ok: [172.31.44.46]
You've probably seen this line in your output — this is the implicit first step that Ansible runs automatically on every playbook. During this step, Ansible:

Connects to the target machine via SSH
Runs the setup module internally
Collects hundreds of system variables (called facts)
Stores them in memory for your playbook to use
So by the time your debug task runs, ansible_os_family already has a value.
